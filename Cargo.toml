[package]
name = "visor_fotos"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
open = "5.3"
rfd = "0.15"
image = { version = "0.25", features = ["png", "jpeg", "bmp", "gif", "tiff", "webp"] }
dirs = "5.0"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
rev = "e7f37f3e817a13b81f63266df98f2528ef608eaf"
features = [
    "wgpu",
    "xdg-portal",
    "about"
]
