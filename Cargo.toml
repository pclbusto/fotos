[package]
name = "visor_fotos"
version = "0.2.0"
edition = "2021"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
open = "5.3"
rfd = "0.15"
image = { version = "0.25", features = ["png", "jpeg", "bmp", "gif", "tiff", "webp"] }
dirs = "5.0"
trash = "5.2.6"
kamadak-exif = "0.6.1"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
rev = "e1f2cd2e52226aa50d59bb2cd6d43ffe290106ed"
default-features = false
features = [
    "tokio",
    "winit",
    "wgpu",
    "surface-message",
    "about"
]
